# Builds the native packages and publishes them on a release.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# jpackage cannot cross-build, so each OS builds its own. Every job produces the
# installer (.pkg / .msi / .deb) and the plain app image as an archive, which is
# what install.sh, install.ps1, Homebrew and Scoop download. "Run workflow" by
# hand does everything except publish, as a dry run.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,       id: macos-arm64 }
          - { runner: macos-15-intel, id: macos-x64 }
          # The oldest Ubuntu on offer: the bundled runtime links against the
          # build machine's glibc, and an older one runs on more distributions.
          - { runner: ubuntu-22.04,   id: linux-x64 }
          # 2022 ships WiX 3, which JDK 21's jpackage needs to build an .msi.
          - { runner: windows-2022,   id: windows-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: matrix.id == 'linux-x64'
        run: ./gradlew test

      - name: Package
        shell: bash
        run: ./gradlew jpackageImage jpackageInstaller -PreleaseVersion=${{ steps.version.outputs.value }}

      - name: Smoke test the app image
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            macos-*)   launcher=build/jpackage/image/airelay.app/Contents/MacOS/airelay ;;
            windows-*) launcher=build/jpackage/image/airelay/airelay.exe ;;
            *)         launcher=build/jpackage/image/airelay/bin/airelay ;;
          esac
          # No JDK on PATH for this: it has to run on its bundled runtime alone.
          env -u JAVA_HOME "$launcher" --help | grep -q "AI Relay"
          # The one check --help cannot make: TLS from the trimmed runtime.
          env -u JAVA_HOME "$launcher" web | tee web.txt
          grep -q "fetchUrl .*Example Domain" web.txt

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cd build/jpackage
          case "${{ matrix.id }}" in
            macos-*)
              tar -czf "../../dist/airelay-${{ matrix.id }}.tar.gz" -C image airelay.app
              mv installer/*.pkg "../../dist/airelay-${{ matrix.id }}.pkg" ;;
            linux-*)
              tar -czf "../../dist/airelay-${{ matrix.id }}.tar.gz" -C image airelay
              mv installer/*.deb "../../dist/airelay-${{ matrix.id }}.deb" ;;
            windows-*)
              (cd image && 7z a -tzip "../../../dist/airelay-${{ matrix.id }}.zip" airelay > /dev/null)
              mv installer/*.msi "../../dist/airelay-${{ matrix.id }}.msi" ;;
          esac
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist/*

  ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: IntelliJ plugin
        working-directory: intellij-plugin
        run: |
          ./gradlew buildPlugin verifyPlugin -PreleaseVersion=${{ steps.version.outputs.value }}
          mkdir -p ../dist && cp build/distributions/*.zip ../dist/

      - name: VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm version --no-git-tag-version ${{ steps.version.outputs.value }} || true
          npx vsce package --out ../dist/airelay-vscode-${{ steps.version.outputs.value }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: ide
          path: dist/*

  publish:
    needs: [package, ide]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package-manager manifests
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_MACOS_ARM64@/$(sha airelay-macos-arm64.tar.gz)/" \
              -e "s/@SHA_MACOS_X64@/$(sha airelay-macos-x64.tar.gz)/" \
              -e "s/@SHA_LINUX_X64@/$(sha airelay-linux-x64.tar.gz)/" \
              packaging/homebrew/airelay.rb.template > dist/airelay.rb
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_WINDOWS_X64@/$(sha airelay-windows-x64.zip)/" \
              packaging/scoop/airelay.json.template > dist/airelay.json
          (cd dist && sha256sum airelay-* > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
