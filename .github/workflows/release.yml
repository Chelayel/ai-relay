# Builds and publishes each piece when its own version moves:
#
#   CLI       — a tag: git tag v1.2.3 && git push origin v1.2.3
#               installers, archives, the GitHub release, Homebrew tap, Scoop
#   IntelliJ  — pluginVersion in intellij-plugin/gradle.properties, on a tag:
#               uploaded when the Marketplace has an older version, skipped
#               when it already has this one
#   VS Code   — version in vscode-extension/package.json, the same way
#
# Only a tag publishes anything. A push to main that touches the IDE pieces
# builds them as a check and stops there: publishing from main as well raced
# the tag's run for the same Marketplace version (one of the two always
# failed), and a plugin built off main bundled the CLI at the build file's
# fallback version rather than the release's.
#
# jpackage cannot cross-build, so each OS builds its own. "Run workflow" by
# hand does everything except publish, as a dry run.
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "intellij-plugin/**"
      - "vscode-extension/**"
      - "ide/chat/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,       id: macos-arm64 }
          - { runner: macos-15-intel, id: macos-x64 }
          # The oldest Ubuntu on offer: the bundled runtime links against the
          # build machine's glibc, and an older one runs on more distributions.
          - { runner: ubuntu-22.04,   id: linux-x64 }
          # 2022 ships WiX 3, which JDK 21's jpackage needs to build an .msi.
          - { runner: windows-2022,   id: windows-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: matrix.id == 'linux-x64'
        run: ./gradlew test

      - name: Package
        shell: bash
        run: ./gradlew jpackageImage jpackageInstaller -PreleaseVersion=${{ steps.version.outputs.value }}

      - name: Smoke test the app image
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            macos-*)   launcher=build/jpackage/image/airelay.app/Contents/MacOS/airelay ;;
            windows-*) launcher=build/jpackage/image/airelay/airelay.exe ;;
            *)         launcher=build/jpackage/image/airelay/bin/airelay ;;
          esac
          # No JDK on PATH for this: it has to run on its bundled runtime alone.
          env -u JAVA_HOME "$launcher" --help | grep -q "AI Relay"
          # The one check --help cannot make: TLS from the trimmed runtime.
          env -u JAVA_HOME "$launcher" web | tee web.txt
          grep -q "fetchUrl .*Example Domain" web.txt

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cd build/jpackage
          case "${{ matrix.id }}" in
            macos-*)
              tar -czf "../../dist/airelay-${{ matrix.id }}.tar.gz" -C image airelay.app
              mv installer/*.pkg "../../dist/airelay-${{ matrix.id }}.pkg" ;;
            linux-*)
              tar -czf "../../dist/airelay-${{ matrix.id }}.tar.gz" -C image airelay
              mv installer/*.deb "../../dist/airelay-${{ matrix.id }}.deb" ;;
            windows-*)
              (cd image && 7z a -tzip "../../../dist/airelay-${{ matrix.id }}.zip" airelay > /dev/null)
              mv installer/*.msi "../../dist/airelay-${{ matrix.id }}.msi" ;;
          esac
          ls -la ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist/*

  ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      # The plugin is built at its own version (gradle.properties); the CLI jars
      # it bundles take the tag's version when there is one, else the root's.
      - name: IntelliJ plugin
        working-directory: intellij-plugin
        run: |
          ./gradlew buildPlugin verifyPlugin ${{ startsWith(github.ref, 'refs/tags/v') && format('-PreleaseVersion={0}', steps.version.outputs.value) || '' }}
          mkdir -p ../dist && cp build/distributions/*.zip ../dist/

      - name: VS Code extension
        working-directory: vscode-extension
        run: |
          (cd .. && ./gradlew installDist ${{ startsWith(github.ref, 'refs/tags/v') && format('-PreleaseVersion={0}', steps.version.outputs.value) || '' }})
          npm ci
          npx vsce package --out ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ide
          path: dist/*

  publish:
    needs: [package, ide]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the CLI goes on the GitHub release. The plugin and the extension are
      # built above for the stores job; users get them from the marketplaces, so
      # there is one install route per IDE and the marketplaces see the traffic.
      - uses: actions/download-artifact@v4
        with:
          pattern: "!ide"
          path: dist
          merge-multiple: true

      - name: Package-manager manifests
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_MACOS_ARM64@/$(sha airelay-macos-arm64.tar.gz)/" \
              -e "s/@SHA_MACOS_X64@/$(sha airelay-macos-x64.tar.gz)/" \
              -e "s/@SHA_LINUX_X64@/$(sha airelay-linux-x64.tar.gz)/" \
              packaging/homebrew/airelay.rb.template > dist/airelay.rb
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_WINDOWS_X64@/$(sha airelay-windows-x64.zip)/" \
              packaging/scoop/airelay.json.template > dist/airelay.json
          (cd dist && sha256sum airelay-* > SHA256SUMS)

      # Idempotent: a rerun of this job after a later step failed finds the
      # release already there and only refreshes its assets.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # The Homebrew tap is its own repository, so the workflow's token cannot
      # push to it. A deploy key on the tap (TAP_DEPLOY_KEY holds the private
      # half; the public half is registered on Chelayel/homebrew-tap with write
      # access) can, and unlike a personal token it is scoped to that one repo
      # and never expires. Without it the formula is only attached to the release
      # and `brew upgrade` never sees the version. Never fatal: a tap that cannot
      # be written must not stop the store uploads.
      - name: Homebrew tap
        continue-on-error: true
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY is not set; the Homebrew tap was not updated. Copy dist/airelay.rb to Chelayel/homebrew-tap Formula/airelay.rb by hand."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Chelayel/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Formula && cp dist/airelay.rb /tmp/tap/Formula/airelay.rb
          cd /tmp/tap
          git -c user.name="ai-relay release" -c user.email="release@ai-relay.invalid" commit -am "airelay $version" >/dev/null 2>&1 || { echo "Tap already at $version."; exit 0; }
          git push origin HEAD
          echo "Tap updated to $version."

  # The two extension stores. Each step runs only when its secret is set, so a
  # release still works before the stores are wired up: the artifacts are on
  # the GitHub release either way. Tokens: docs/publishing.md.
  # Each store gets its piece only when the piece's own version is newer than
  # what the store has, so a CLI-only tag publishes no plugin.
  stores:
    needs: [ide]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: ide
          path: dist

      - name: Versions
        id: v
        shell: bash
        run: |
          plugin=$(grep -E '^pluginVersion=' intellij-plugin/gradle.properties | cut -d= -f2 | tr -d ' \r')
          vsx=$(node -p "require('./vscode-extension/package.json').version")
          jb=$(curl -sS "https://plugins.jetbrains.com/plugins/list?pluginId=com.chelayel.airelay" | grep -o '<version>[^<]*</version>' | head -1 | sed 's/<[^>]*>//g')
          ms=$(npx --yes @vscode/vsce show chelayel.ai-relay --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version}catch(e){''}")
          echo "plugin=$plugin"  >> "$GITHUB_OUTPUT"; echo "vsx=$vsx" >> "$GITHUB_OUTPUT"
          echo "jb=$jb" >> "$GITHUB_OUTPUT"; echo "ms=$ms" >> "$GITHUB_OUTPUT"
          echo "IntelliJ plugin $plugin (Marketplace has ${jb:-nothing}); VS Code $vsx (Marketplace has ${ms:-nothing})"

      - name: JetBrains Marketplace
        if: steps.v.outputs.plugin != steps.v.outputs.jb
        working-directory: intellij-plugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set; skipping the JetBrains Marketplace upload."
            exit 0
          fi
          # The bundled CLI takes the tag's version.
          ./gradlew publishPlugin -PreleaseVersion="${GITHUB_REF_NAME#v}"
          echo "Published IntelliJ plugin ${{ steps.v.outputs.plugin }}."

      # Two ways in. Preferred: a user-assigned managed identity in Azure that is
      # a Contributor on the Marketplace publisher, reached through GitHub's
      # OIDC token (no stored secret; the job's `environment` is what the
      # federated credential trusts). Fallback: a global Azure DevOps PAT, which
      # Microsoft retires on 2026-12-01. docs/publishing.md has the setup.
      - name: Azure sign-in (managed identity)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: VS Code Marketplace
        if: steps.v.outputs.vsx != steps.v.outputs.ms
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix=$(ls dist/ai-relay-*.vsix | head -1)
          if [ -n "$AZURE_CLIENT_ID" ]; then
            npx --yes @vscode/vsce publish --packagePath "$vsix" --skip-duplicate --azure-credential
          elif [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath "$vsix" --skip-duplicate
          else
            echo "::warning::Neither AZURE_CLIENT_ID nor VSCE_PAT is set; skipping the VS Code Marketplace upload."
          fi

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set; skipping Open VSX (VSCodium and other VS Code forks)."
            exit 0
          fi
          npx --yes ovsx publish "$(ls dist/ai-relay-*.vsix | head -1)" -p "$OVSX_PAT"
