# One-off helper for docs/publishing.md: prints the id the VS Code Marketplace
# knows the managed identity by. The Marketplace runs on Azure DevOps, whose
# profile ids are separate from Entra object ids, and the publisher's Members
# page accepts only that one. It can only be read while signed in *as* the
# identity, which is why this runs in the same environment the release uses.
name: marketplace-identity

on:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace profile id
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
                --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "::notice::Add this id as a Contributor member of the publisher at https://marketplace.visualstudio.com/manage: $id"
          echo "$id"
